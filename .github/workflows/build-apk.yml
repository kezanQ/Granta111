name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip Android project
        run: |
          mkdir -p project
          unzip -q M74CAN-Diagnostic_READY.zip -d project

      - name: Find Gradle project
        id: gradle
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found"
            find project -maxdepth 3 -type f | head -100
            exit 1
          fi
          echo "GRADLEW=$GRADLEW" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          chmod +x "$GRADLEW"
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug --no-daemon

      - name: Find APK
        run: |
          find project -name "*.apk" -type f -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: M74CAN-Diagnostic-APK
          path: project/**/build/outputs/apk/**/*.apk
